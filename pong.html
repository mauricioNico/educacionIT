<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pong - Juego para 2 jugadores</title>
  <style>
    /* Estilo general */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      text-align: center;
    }

    canvas {
      display: block;
      margin: 20px auto;
      background-color: #111;
      border: 3px solid #fff;
    }

    #instrucciones {
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🏓 Pong - Juego de 2 jugadores</h1>
  <p id="instrucciones">
    Jugador 1: Usa las teclas <strong>A</strong> (arriba) y <strong>Z</strong> (abajo)<br>
    Jugador 2: Usa las flechas <strong>↑</strong> y <strong>↓</strong><br>
    El juego reinicia automáticamente tras cada punto.
  </p>

  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Dimensiones de paletas y pelota
    const paddleWidth = 10, paddleHeight = 100;
    const ballSize = 10;

    // Posiciones iniciales
    let leftY = canvas.height / 2 - paddleHeight / 2;
    let rightY = canvas.height / 2 - paddleHeight / 2;
    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballSpeedX = 5;
    let ballSpeedY = 3;

    // Velocidad de movimiento de las paletas
    const paddleSpeed = 6;

    // Estados de teclas
    let keys = {};

    // Puntajes
    let scoreLeft = 0;
    let scoreRight = 0;

    // Dibuja las paletas
    function drawPaddles() {
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, leftY, paddleWidth, paddleHeight); // izquierda
      ctx.fillRect(canvas.width - paddleWidth, rightY, paddleWidth, paddleHeight); // derecha
    }

    // Dibuja la pelota
    function drawBall() {
      ctx.fillStyle = "#0f0";
      ctx.fillRect(ballX, ballY, ballSize, ballSize);
    }

    // Dibuja los puntajes
    function drawScore() {
      ctx.font = "24px Arial";
      ctx.fillText(`Jugador 1: ${scoreLeft}`, 50, 30);
      ctx.fillText(`Jugador 2: ${scoreRight}`, canvas.width - 200, 30);
    }

    // Lógica principal del juego
    function update() {
      // Movimiento de paletas
      if (keys['a'] && leftY > 0) leftY -= paddleSpeed;
      if (keys['z'] && leftY < canvas.height - paddleHeight) leftY += paddleSpeed;
      if (keys['ArrowUp'] && rightY > 0) rightY -= paddleSpeed;
      if (keys['ArrowDown'] && rightY < canvas.height - paddleHeight) rightY += paddleSpeed;

      // Movimiento de la pelota
      ballX += ballSpeedX;
      ballY += ballSpeedY;

      // Rebote en techo o piso
      if (ballY <= 0 || ballY >= canvas.height - ballSize) {
        ballSpeedY = -ballSpeedY;
      }

      // Colisión con paleta izquierda
      if (ballX <= paddleWidth && ballY + ballSize > leftY && ballY < leftY + paddleHeight) {
        ballSpeedX = -ballSpeedX;
      }

      // Colisión con paleta derecha
      if (ballX + ballSize >= canvas.width - paddleWidth &&
          ballY + ballSize > rightY && ballY < rightY + paddleHeight) {
        ballSpeedX = -ballSpeedX;
      }

      // Punto para jugador 2
      if (ballX < 0) {
        scoreRight++;
        resetBall();
      }

      // Punto para jugador 1
      if (ballX > canvas.width) {
        scoreLeft++;
        resetBall();
      }

      draw();
    }

    // Reinicia la pelota en el centro
    function resetBall() {
      ballX = canvas.width / 2;
      ballY = canvas.height / 2;
      ballSpeedX = -ballSpeedX; // Cambia dirección para que no repita el mismo lado
      ballSpeedY = 3 * (Math.random() > 0.5 ? 1 : -1); // Cambia dirección vertical aleatoriamente
    }

    // Dibuja toda la escena
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPaddles();
      drawBall();
      drawScore();
    }

    // Loop principal (60 FPS aprox)
    function gameLoop() {
      update();
      requestAnimationFrame(gameLoop);
    }

    // Captura teclas presionadas
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
    });

    // Captura teclas soltadas
    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // Inicia el juego
    gameLoop();
  </script>
</body>
</html>
